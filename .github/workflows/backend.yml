name: Deploy API apps

on:
  push:
    paths:
      - 'apps/api/**'
      - 'libs/types/**'
      - 'libs/utils/**'
      - 'Dockerfile-backend'
      - '.github/workflows/backend.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Build image on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /media/roja-apps/${{ github.event.repository.name }}
            git pull 
            docker build -t pondokroja/api:latest -f Dockerfile-backend .

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /media/roja-apps
            docker compose up api api-stg -d --force-recreate

  push:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Push image to Docker Hub
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            docker push pondokroja/api:latest

